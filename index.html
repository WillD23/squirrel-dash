<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ru's Squirrel Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one arcade cabinet screen, centred, with a control strip beneath. Single dark look by choice. */
:root {
  --bg: #12091f;
  --panel: #1f1233;
  --ink: #f6e7c8;
  --muted: #b9a3d6;
  --accent: #ff8a2a;
  --gold: #ffd23f;
  --edge: #3a2457;
  --font-display: "Press Start 2P", "Courier New", monospace;
  --font-body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  box-sizing: border-box;
}
.wrap {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 16px;
}
h1 {
  font-family: var(--font-display);
  font-size: clamp(16px, 3.4vw, 26px);
  font-weight: 400;
  margin: 0;
  color: var(--gold);
  text-shadow: 3px 3px 0 #b3401a;
  letter-spacing: 0.04em;
  text-wrap: balance;
}
.player {
  font-family: var(--font-display);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.1em;
}
.cabinet {
  position: relative;
  background: #000;
  border: 4px solid var(--edge);
  box-shadow: 0 0 0 4px #0a0512, 0 0 40px rgba(255, 138, 42, 0.18);
  border-radius: 6px;
  overflow: hidden;
  line-height: 0;
}
canvas {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 9;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  cursor: pointer;
}
.cabinet::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.16) 3px, rgba(0,0,0,0) 4px);
  mix-blend-mode: multiply;
}
.cabinet:fullscreen { border: 0; border-radius: 0; display: flex; align-items: center; justify-content: center; background: #000; }
.cabinet:fullscreen canvas { width: auto; height: 100%; max-height: 100vh; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
button {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--ink);
  background: var(--panel);
  border: 3px solid var(--edge);
  padding: 10px 14px;
  box-shadow: 3px 3px 0 #0a0512;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0a0512; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button .val { color: var(--gold); }
.hint {
  margin: 0;
  color: var(--muted);
  max-width: 62ch;
  line-height: 1.15;
}
.hint b { color: var(--ink); font-weight: 400; }
@media (prefers-reduced-motion: reduce) {
  button:active { transform: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>SQUIRREL DASH</h1>
    <span class="player">PLAYER 1: RU</span>
  </header>

  <div class="cabinet" id="cabinet">
    <canvas id="game" width="384" height="216" aria-label="Squirrel Dash game screen. Press space or tap to jump."></canvas>
  </div>

  <div class="controls">
    <button id="levelBtn" type="button">LEVEL: <span class="val" id="levelVal">WOOD</span></button>
    <button id="speedBtn" type="button">SPEED: <span class="val" id="speedVal">GENTLE</span></button>
    <button id="soundBtn" type="button">SOUND: <span class="val" id="soundVal">ON</span></button>
    <button id="fsBtn" type="button">FULL SCREEN</button>
  </div>

  <p class="hint"><b>Jump:</b> space bar, up arrow, or tap the screen. Hold for a bigger jump. Grab acorns for <b>+25</b>. <b>Levels:</b> the Autumn Wood, or a dash down Winchester High Street past the cathedral, the Great Hall, the Westgate and King Alfred.</p>
</div>

<script>
(() => {
  const W = 384, H = 216, GY = 180;          // internal resolution and ground line
  const GRAV = 1800, JUMP_V = -560, CUT_V = -400;
  const SPEEDS = {
    gentle: { start: 140, max: 280, ramp: 3, gap: 1.15, label: "GENTLE" },
    zoomy:  { start: 200, max: 440, ramp: 6, gap: 1.0,  label: "ZOOMY" }
  };

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const cvs = document.getElementById("game");
  const ctx = cvs.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  let mode = store.get("sqd-mode", "gentle"); if (!SPEEDS[mode]) mode = "gentle";
  let muted = store.get("sqd-muted", "0") === "1";

  // ---------- helpers ----------
  function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function sprite(rows, pal) {
    const w = Math.max(...rows.map(r => r.length)), h = rows.length;
    const c = mk(w, h), x = c.getContext("2d");
    rows.forEach((r, y) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } }));
    return c;
  }
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function blob(x, cx, cy, r, col) {
    x.fillStyle = col;
    for (let dy = -r; dy <= r; dy += 2) {
      const half = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)) / 2) * 2;
      x.fillRect(cx - half, cy + dy, half * 2, 2);
    }
  }
  function R(x, X, Y, w, h, col) { x.fillStyle = col; x.fillRect(X, Y, w, h); }
  function lancet(x, X, Y, w, h, col) {           // pointed gothic window
    const half = Math.floor(w / 2);
    for (let k = 0; k < half; k++) R(x, X + half - 1 - k, Y + k, 2 + 2 * k, 1, col);
    R(x, X, Y + half, w, h - half, col);
  }
  function gable(x, cx, topY, halfW, col) {
    for (let k = 0; k < halfW; k++) R(x, cx - k - 1, topY + k, 2 * k + 2, 1, col);
  }
  function crenel(x, X, Y, w, col) { for (let i = X; i < X + w; i += 4) R(x, i, Y - 3, 2, 3, col); }

  // ---------- shared sprites ----------
  const SQ_PAL = { D: "#3b1d0e", o: "#c8642a", t: "#ec9d4b", c: "#f6dcb0", k: "#111111" };
  const SQ_BODY = [
    ".DDD.......D....",
    "DtttD.....DoD...",
    "DttttD...DooooD.",
    "DtttttD.DoookooD",
    "DtttttD.DooooooD",
    ".DttttD..DooccD.",
    ".DtttttDDoooccD.",
    "..DtttttooooccD.",
    "...DttDooooooccD",
    "....DDooooooocD.",
    ".....DooooooDD.."
  ];
  const sqRunA = sprite(SQ_BODY.concat([".....DoD..DoD...", "....DDD..DDD...."]), SQ_PAL);
  const sqRunB = sprite(SQ_BODY.concat(["......DoDDoD....", ".....DDD.DDD...."]), SQ_PAL);
  const sqJump = sprite(SQ_BODY.concat(["......DooooD....", ".......DDDD....."]), SQ_PAL);

  const hedgeSpr = sprite([
    "....D.D.D...",
    "..DbDbDbD...",
    ".DbbbbbbbD..",
    "DbbbbbbbbffD",
    "DbbbbbbbfkfD",
    "DbbbbbbbfffN",
    ".DbbbbbbbfD.",
    "..D.D..D.D.."
  ].map(r => [...r].reverse().join("")), { D: "#2a1a10", b: "#6e5136", f: "#d8b78c", k: "#111111", N: "#111111" });

  const swanSpr = sprite([
    "..DD..........",
    ".DkwD.........",
    "bDwwD.........",
    "bbDwD.........",
    "...DwD........",
    "...DwD.....D..",
    "...DwwDDDDDwD.",
    "..DwwwwwwwwwwD",
    "..DwwwwwwwwwD.",
    "...DwwwwwwwD..",
    "....DDDDDDD..."
  ], { D: "#2a2a35", w: "#f4f2ee", b: "#f08a24", k: "#111111" });

  const acornSpr = sprite(["..D...", ".CCCC.", "CCCCCC", ".aaaa.", ".aaaa.", "..aa.."], { D: "#3b1d0e", C: "#6b3a1a", a: "#e0a945" });

  // ---------- obstacle drawing ----------
  function drawHedge(x) { ctx.drawImage(hedgeSpr, 0, 0, 12, 8, Math.round(x), GY - 16, 24, 16); }
  function drawSwan(x) {
    const bob = Math.round(Math.sin(t * 6 + x * 0.1));
    ctx.drawImage(swanSpr, 0, 0, 14, 11, Math.round(x), GY - 22 + bob, 28, 22);
  }
  function drawStump(o) {
    const x = Math.round(o.x), y = o.y;
    R(ctx, x, y, o.w, o.h, "#2b160b");
    R(ctx, x + 2, y + 2, o.w - 4, o.h - 2, "#6b3f1f");
    for (let i = x + 5; i < x + o.w - 3; i += 5) R(ctx, i, y + 6, 2, o.h - 8, "#4e2c14");
    R(ctx, x + 2, y + 1, o.w - 4, 3, "#d9a86a");
    R(ctx, x + o.w / 2 - 3, y + 2, 6, 1, "#a8743c");
    R(ctx, x - 2, GY - 2, 4, 2, "#2b160b"); R(ctx, x + o.w - 2, GY - 2, 4, 2, "#2b160b");
  }
  function drawRock(o) {
    const x = Math.round(o.x), y = o.y, w = o.w, h = o.h;
    R(ctx, x + 4, y, w - 8, h, "#2a2433"); R(ctx, x + 2, y + 2, w - 4, h - 2, "#2a2433"); R(ctx, x, y + 6, w, h - 6, "#2a2433");
    R(ctx, x + 4, y + 2, w - 8, h - 2, "#7c7488"); R(ctx, x + 2, y + 6, w - 4, h - 6, "#7c7488");
    R(ctx, x + 6, y + 2, Math.floor(w / 3), 2, "#a59cb2"); R(ctx, x + 4, y + 4, 4, 2, "#a59cb2");
    R(ctx, x + w - 10, y + h - 6, 6, 2, "#5a5366");
  }
  function drawBollard(x) {
    x = Math.round(x);
    const h = 22, y = GY - h;
    R(ctx, x + 2, y, 6, 2, "#1b1b24");
    R(ctx, x + 1, y + 2, 8, h - 2, "#1b1b24");
    R(ctx, x + 1, y + 6, 8, 2, "#c9a227");
    R(ctx, x + 3, y + 3, 1, h - 7, "#4a4a5c");
    R(ctx, x, GY - 3, 10, 3, "#1b1b24");
  }
  function drawCrate(o) {
    const x = Math.round(o.x);
    const one = (y, h) => {
      R(ctx, x, y, o.w, h, "#3a2412");
      R(ctx, x + 1, y + 1, o.w - 2, h - 2, "#a8763e");
      R(ctx, x + 1, y + Math.floor(h / 2), o.w - 2, 1, "#6b4520");
      R(ctx, x + 2, y + 1, 2, h - 2, "#7d5228"); R(ctx, x + o.w - 4, y + 1, 2, h - 2, "#7d5228");
    };
    if (o.h > 20) { one(o.y, 15); one(o.y + 15, o.h - 15); }
    else {
      one(o.y, o.h);
      R(ctx, x + 3, o.y - 3, 4, 3, "#c0392b"); R(ctx, x + 9, o.y - 4, 5, 4, "#5d9b3a"); R(ctx, x + 15, o.y - 3, 4, 3, "#e67e22");
    }
  }
  function drawFlintWall(o) {
    const x = Math.round(o.x), y = o.y, w = o.w, h = o.h;
    R(ctx, x, y + 3, w, h - 3, "#4a4652");
    const cols = ["#8d8a96", "#6f6c78", "#a9a6b1"];
    for (let j = y + 5; j < GY - 1; j += 3) for (let i = x + 1 + ((j / 3) % 2) * 2; i < x + w - 2; i += 5) {
      R(ctx, i, j, 3, 2, cols[(i * 7 + j * 13) % 3]);
    }
    R(ctx, x - 1, y, w + 2, 4, "#9a4f3a"); R(ctx, x - 1, y, w + 2, 1, "#c06a50");
  }

  // ---------- level art ----------
  function hillsLayer(w, base, amps, col, extra) {
    const c = mk(w, H), x = c.getContext("2d");
    if (extra && extra.before) extra.before(x);
    for (let i = 0; i < w; i += 4) {
      const a = (Math.PI * 2 * i) / w;
      let y = base;
      amps.forEach(([k, amp, ph]) => { y += Math.sin(a * k + ph) * amp; });
      if (extra && extra.shape) y = Math.min(y, extra.shape(i));
      y = Math.round(y / 2) * 2;
      R(x, i, y, 4, H - y, col);
    }
    if (extra && extra.after) extra.after(x);
    return c;
  }

  // Autumn Wood
  const woodFar = hillsLayer(768, 122, [[2, 12, 0], [5, 5, 1]], "#3d1a4d");
  const woodMid = (() => {
    const w = 768, c = mk(w, H), x = c.getContext("2d"), r = rng(7);
    const cols = ["#8f3a2c", "#a85a2a", "#9a7a2c", "#6e2c3c", "#b0482c"];
    for (let px = 10; px < w; px += 34 + Math.floor(r() * 40)) {
      const rad = 12 + Math.floor(r() * 10), trunkH = 18 + Math.floor(r() * 12);
      const cy = GY - trunkH - rad + 6, col = cols[Math.floor(r() * cols.length)];
      for (const off of [0, -w, w]) {
        R(x, px + off - 2, GY - trunkH, 4, trunkH, "#2b1424");
        blob(x, px + off, cy, rad, "#2b1424");
        blob(x, px + off, cy, rad - 2, col);
        blob(x, px + off - 4, cy - 4, Math.max(4, rad - 8), "rgba(255,210,120,0.22)");
      }
    }
    return c;
  })();
  const woodGround = (() => {
    const c = mk(64, H - GY), x = c.getContext("2d"), r = rng(3);
    R(x, 0, 0, 64, H - GY, "#5a3418");
    for (let i = 0; i < 60; i++) R(x, Math.floor(r() * 32) * 2, 8 + Math.floor(r() * 13) * 2, 2, 2, r() < 0.5 ? "#7a4a22" : "#3e220f");
    R(x, 0, 0, 64, 6, "#6b8f2a"); R(x, 0, 6, 64, 2, "#4c6b1d");
    for (let i = 0; i < 64; i += 6) R(x, i + Math.floor(r() * 3), 0, 2, 2, "#8fb43a");
    return c;
  })();

  // Winchester
  const winFar = (() => {
    const w = 800;
    const hillShape = i => {                       // St Catherine's Hill, a rounded down
      const d = (i - 220) / 110;
      return Math.abs(d) < 1 ? 128 - Math.cos(d * Math.PI / 2) * 34 : 999;
    };
    return hillsLayer(w, 140, [[1, 6, 0.4], [3, 4, 2]], "#4b5c5a", {
      before(x) {
        const r = rng(11);
        for (let n = 0; n < 6; n++) {
          const cx = 40 + n * 130 + Math.floor(r() * 50), cy = 26 + Math.floor(r() * 40);
          blob(x, cx, cy + 2, 8, "#d9b8a8"); blob(x, cx + 12, cy, 10, "#d9b8a8"); blob(x, cx + 24, cy + 3, 7, "#d9b8a8");
          blob(x, cx + 2, cy, 7, "#f6dccb"); blob(x, cx + 12, cy - 2, 8, "#f6dccb"); blob(x, cx + 22, cy + 1, 5, "#f6dccb");
        }
      },
      shape: hillShape,
      after(x) {
        blob(x, 220, 92, 10, "#2c3a35");          // the clump of beech trees on top
        blob(x, 212, 95, 6, "#2c3a35");
        blob(x, 229, 95, 6, "#2c3a35");
        R(x, 140, 120, 2, 2, "#6c7c74"); R(x, 300, 118, 2, 2, "#6c7c74");
      }
    });
  })();

  const winMid = (() => {
    const w = 800, c = mk(w, H), x = c.getContext("2d");
    const stone = "#b59a72", shade = "#8a7356", dark = "#5d4c3c", slate = "#403e54", win = "#2a2238", lit = "#f2c66b";
    const flint = "#6f6c78", bronze = "#36443b", bronzeHi = "#5c6e5c", granite = "#7d7a86";

    // Winchester Cathedral: long nave, west front, squat central tower
    R(x, 64, 106, 194, 6, slate); R(x, 62, 110, 198, 4, slate);
    R(x, 60, 114, 200, GY - 114, stone);
    gable(x, 166, 94, 22, stone);                  // transept gable
    R(x, 60, 132, 200, 4, slate);                   // aisle roof
    for (let bx = 68; bx < 258; bx += 16) { R(x, bx, 136, 4, GY - 136, shade); R(x, bx - 1, GY - 8, 6, 8, shade); }
    for (let wx = 74; wx < 256; wx += 16) {
      if (wx > 144 && wx < 186) continue;
      lancet(x, wx, 117, 6, 13, win);
      lancet(x, wx, 142, 6, 22, (wx / 16) % 3 < 1 ? lit : win);
    }
    R(x, 150, 80, 32, 40, stone); crenel(x, 150, 80, 32, stone); R(x, 178, 77, 4, 43, shade);
    lancet(x, 156, 88, 6, 16, win); lancet(x, 170, 88, 6, 16, win);
    R(x, 30, 96, 32, GY - 96, stone); gable(x, 46, 80, 16, stone);
    R(x, 28, 86, 4, 10, stone); R(x, 29, 82, 2, 4, stone); R(x, 60, 86, 4, 10, stone); R(x, 61, 82, 2, 4, stone);
    lancet(x, 38, 100, 16, 42, win);
    R(x, 42, 112, 1, 30, shade); R(x, 46, 108, 1, 34, shade); R(x, 50, 112, 1, 30, shade); R(x, 38, 124, 16, 1, shade);
    lancet(x, 41, 158, 10, 22, dark);

    // Plane tree
    R(x, 278, 140, 4, 40, "#3a2a24"); blob(x, 280, 130, 16, "#3b5238"); blob(x, 276, 124, 8, "#55704a");

    // Great Hall: flint walls, steep gable, tall lancets
    gable(x, 330, 74, 32, slate);
    R(x, 298, 106, 64, GY - 106, flint);
    gable(x, 330, 80, 28, flint);
    for (let j = 108; j < GY; j += 4) for (let i = 300; i < 360; i += 6) if ((i + j) % 3 === 0) R(x, i + (j % 8 ? 2 : 0), j, 2, 2, "#8a8794");
    R(x, 298, 106, 4, GY - 106, stone); R(x, 358, 106, 4, GY - 106, stone);
    lancet(x, 306, 114, 10, 40, win); lancet(x, 325, 108, 10, 46, win); lancet(x, 344, 114, 10, 40, win);
    R(x, 311, 122, 1, 32, stone); R(x, 330, 116, 1, 38, stone); R(x, 349, 122, 1, 32, stone);
    lancet(x, 325, 162, 10, 18, dark);

    // Westgate
    R(x, 380, 150, 20, 30, shade); R(x, 444, 150, 14, 30, shade);
    R(x, 400, 104, 44, GY - 104, stone); crenel(x, 400, 104, 44, stone); R(x, 440, 101, 4, GY - 101, shade);
    lancet(x, 414, 146, 16, GY - 146, "#1c1626");
    R(x, 408, 116, 4, 7, win); R(x, 432, 116, 4, 7, win); R(x, 420, 124, 4, 7, win);

    // Terraced houses on the High Street
    const house = (hx, hw, top, wall, roof, timber) => {
      gable(x, hx + hw / 2, top - hw / 2 + 4, hw / 2 + 1, roof);
      R(x, hx, top, hw, GY - top, wall);
      if (timber) {
        R(x, hx, top, hw, 1, "#2e2420"); R(x, hx, top + 16, hw, 2, "#2e2420");
        for (let i = hx; i <= hx + hw - 2; i += 6) R(x, i, top, 2, GY - top, "#2e2420");
      }
      for (let wy = top + 5; wy < GY - 12; wy += 16) for (let wx = hx + 4; wx < hx + hw - 5; wx += 8) R(x, wx, wy, 4, 6, (wx + wy) % 5 === 0 ? lit : win);
      R(x, hx + hw / 2 - 3, GY - 12, 6, 12, dark);
      R(x, hx + 3, top - hw / 2 - 2, 4, 6, "#7a3a2c");
    };
    house(462, 22, 128, "#8a4a3a", slate, false);
    house(486, 24, 122, "#c8b9a3", "#5a4048", true);
    house(512, 20, 132, "#a8604a", slate, false);

    // King Alfred statue on The Broadway
    R(x, 540, 162, 42, 18, granite); R(x, 546, 150, 30, 12, granite); R(x, 550, 142, 22, 8, "#6c6976");
    for (let k = 0; k < 30; k++) { const cw = 4 + Math.floor(k * 0.5); R(x, 561 - Math.floor(cw / 2), 112 + k, cw, 1, bronze); }
    R(x, 558, 104, 6, 9, bronze); R(x, 557, 102, 8, 3, bronzeHi);
    R(x, 566, 118, 6, 16, bronzeHi); R(x, 567, 119, 4, 14, bronze);
    R(x, 555, 94, 3, 14, bronze);
    R(x, 556, 64, 2, 32, bronzeHi); R(x, 551, 72, 12, 2, bronzeHi);

    // Plane tree
    R(x, 600, 140, 4, 40, "#3a2a24"); blob(x, 602, 128, 18, "#3b5238"); blob(x, 597, 120, 9, "#55704a");

    // Buttercross
    R(x, 620, 174, 26, 6, shade);
    R(x, 625, 148, 16, 26, stone); lancet(x, 629, 154, 8, 18, "#1c1626");
    R(x, 628, 130, 10, 18, stone); R(x, 630, 116, 6, 14, stone); R(x, 632, 100, 2, 16, stone);
    R(x, 623, 142, 2, 8, stone); R(x, 641, 142, 2, 8, stone); R(x, 626, 124, 2, 6, stone); R(x, 638, 124, 2, 6, stone);

    house(660, 24, 126, "#c8b9a3", "#5a4048", true);
    house(686, 22, 132, "#8a4a3a", slate, false);
    house(710, 26, 120, "#b59a72", slate, false);
    house(738, 22, 128, "#c8b9a3", "#5a4048", true);
    house(762, 26, 124, "#a8604a", slate, false);
    return c;
  })();

  const winGround = (() => {
    const c = mk(64, H - GY), x = c.getContext("2d"), r = rng(5);
    R(x, 0, 0, 64, H - GY, "#4a4652");
    const cols = ["#7d7987", "#8a8694", "#726e7c", "#6a6674"];
    for (let row = 0, y = 4; y < H - GY; y += 6, row++) {
      for (let i = (row % 2) * 4 - 4; i < 64; i += 8) {
        R(x, i + 1, y + 1, 6, 4, cols[Math.floor(r() * cols.length)]);
        R(x, i + 1, y + 1, 2, 1, "#a6a2ae");
      }
    }
    R(x, 0, 0, 64, 3, "#b8b2a6"); R(x, 0, 3, 64, 1, "#3a3642");
    return c;
  })();

  const LEVELS = {
    wood: {
      name: "AUTUMN WOOD", label: "WOOD",
      sky: ["#1b0f3a", "#24124a", "#341858", "#4b1f66", "#6d276f", "#963370", "#c24869", "#e5675c", "#f68f52"],
      far: woodFar, mid: woodMid, ground: woodGround,
      leaves: ["#e8742c", "#d9452b", "#f2b13a", "#b8572a"],
      sun(sky) {
        blob(ctx, 296, 108, 30, "#ffd25e"); blob(ctx, 296, 108, 22, "#ffe58a");
        for (let i = 0; i < 5; i++) R(ctx, 262, 108 + i * 6, 70, 1 + Math.floor(i / 2), sky[6 + Math.min(2, Math.floor(i / 2))]);
      },
      pick(score) {
        const r = Math.random();
        if (score > 250 && r < 0.15) return { type: "hedge2", w: 48, h: 16 };
        if (r < 0.42) return { type: "stump", w: 18 + Math.floor(Math.random() * 4) * 2, h: 20 + Math.floor(Math.random() * 6) * 2 };
        if (r < 0.72) return { type: "rock", w: 24 + Math.floor(Math.random() * 6) * 2, h: 14 + Math.floor(Math.random() * 3) * 2 };
        return { type: "hedge", w: 24, h: 16 };
      }
    },
    winchester: {
      name: "WINCHESTER", label: "WINCHESTER",
      sky: ["#24325e", "#2f4577", "#3f5a8e", "#5873a3", "#7c8fb3", "#a8a8bb", "#d4b8a8", "#ecc79a", "#f6d79a"],
      far: winFar, mid: winMid, ground: winGround,
      leaves: ["#d9a441", "#b8862e", "#c96a2c", "#9a7a3a"],
      sun() { blob(ctx, 92, 104, 22, "#ffe2a0"); blob(ctx, 92, 104, 16, "#fff1c4"); },
      pick(score) {
        const r = Math.random();
        if (score > 250 && r < 0.12) return { type: "swan2", w: 56, h: 18 };
        if (r < 0.18) return { type: "bollard", w: 10, h: 22 };
        if (r < 0.3) return { type: "bollard2", w: 34, h: 22 };
        if (r < 0.52) return Math.random() < 0.4 ? { type: "crate", w: 22, h: 30 } : { type: "crate", w: 22, h: 16 };
        if (r < 0.75) return { type: "flint", w: 30 + Math.floor(Math.random() * 6) * 2, h: 14 + Math.floor(Math.random() * 2) * 2 };
        return { type: "swan", w: 28, h: 18 };
      }
    }
  };

  function drawObstacle(o) {
    switch (o.type) {
      case "stump": drawStump(o); break;
      case "rock": drawRock(o); break;
      case "hedge": drawHedge(o.x); break;
      case "hedge2": drawHedge(o.x); drawHedge(o.x + 24); break;
      case "bollard": drawBollard(o.x); break;
      case "bollard2": drawBollard(o.x); drawBollard(o.x + 24); break;
      case "crate": drawCrate(o); break;
      case "flint": drawFlintWall(o); break;
      case "swan": drawSwan(o.x); break;
      case "swan2": drawSwan(o.x); drawSwan(o.x + 28); break;
    }
  }

  let levelKey = store.get("sqd-level", "wood"); if (!LEVELS[levelKey]) levelKey = "wood";
  let L = LEVELS[levelKey];
  const hiKey = k => "sqd-hi-" + k;
  if (store.get(hiKey("wood"), null) === null && store.get("sqd-hi", null) !== null) store.set(hiKey("wood"), store.get("sqd-hi", "0"));
  let hi = parseInt(store.get(hiKey(levelKey), "0"), 10) || 0;

  // ---------- sound ----------
  let actx = null;
  function beep(f1, f2, dur, type = "square", vol = 0.06, delay = 0) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const t0 = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, t0);
      o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  const sfx = {
    jump: () => beep(320, 640, 0.12),
    acorn: () => { beep(880, 1320, 0.07); beep(1320, 1760, 0.08, "square", 0.05, 0.07); },
    crash: () => beep(220, 50, 0.45, "sawtooth", 0.08),
    milestone: () => { beep(660, 660, 0.06, "square", 0.04); beep(990, 990, 0.08, "square", 0.04, 0.07); },
    select: () => beep(520, 780, 0.06, "square", 0.04)
  };

  // ---------- game state ----------
  let state = "title", t = 0, overT = 0, shake = 0, bannerT = 0;
  let speed = SPEEDS[mode].start, score = 0, acornsGot = 0, nextMilestone = 100, newHi = false, flash = 0;
  let obstacles = [], acorns = [], floats = [];
  let obsDist = 0, acornDist = 0;
  let scrollFar = 0, scrollMid = 0, scrollGround = 0;
  let held = false;
  const player = { x: 48, y: GY - 26, vy: 0, onGround: true, buffer: 0, animT: 0 };
  const leaves = Array.from({ length: 14 }, (_, i) => ({
    x: Math.random() * W, y: Math.random() * GY, s: 0.5 + Math.random(), p: Math.random() * 6, i
  }));

  function setLevel(k) {
    levelKey = k; L = LEVELS[k];
    store.set("sqd-level", k);
    hi = parseInt(store.get(hiKey(k), "0"), 10) || 0;
    paintButtons();
  }
  function cycleLevel(dir) {
    const keys = Object.keys(LEVELS);
    const i = (keys.indexOf(levelKey) + dir + keys.length) % keys.length;
    setLevel(keys[i]); sfx.select();
    if (state === "over") state = "title";
    if (state === "play") { reset(); bannerT = 1.8; }
  }

  function reset() {
    speed = SPEEDS[mode].start; score = 0; acornsGot = 0; nextMilestone = 100; newHi = false;
    obstacles = []; acorns = []; floats = [];
    obsDist = 180; acornDist = 260;
    player.y = GY - 26; player.vy = 0; player.onGround = true; player.buffer = 0;
  }

  function press() {
    held = true;
    if (state === "title") { reset(); state = "play"; bannerT = 1.8; sfx.jump(); return; }
    if (state === "over") { if (overT > 0.6) { reset(); state = "play"; bannerT = 1.8; } return; }
    player.buffer = 0.12;
  }
  function release() { held = false; }

  function gameOver() {
    state = "over"; overT = 0; shake = 0.3; sfx.crash();
    const s = Math.floor(score);
    if (s > hi) { hi = s; newHi = true; store.set(hiKey(levelKey), String(hi)); }
  }

  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  function scroll(dx) { scrollFar += dx * 0.15; scrollMid += dx * 0.4; scrollGround += dx; }

  function update(dt) {
    t += dt;
    const leafSpeed = state === "play" ? speed : 50;
    for (const l of leaves) {
      l.x -= (leafSpeed * 0.5 + 14) * l.s * dt;
      l.y += (18 + Math.sin(t * 2 + l.p) * 14) * l.s * dt;
      if (l.x < -4 || l.y > GY) { l.x = W + Math.random() * 40; l.y = Math.random() * 120; }
    }
    if (shake > 0) shake -= dt;
    if (flash > 0) flash -= dt;
    if (bannerT > 0) bannerT -= dt;

    if (state === "title") { scroll(50 * dt); player.animT += dt; return; }
    if (state === "over") { overT += dt; return; }

    const cfg = SPEEDS[mode];
    speed = Math.min(cfg.max, speed + cfg.ramp * dt);
    const dx = speed * dt;
    scroll(dx);
    score += dx / 12;
    if (score >= nextMilestone) { nextMilestone += 100; sfx.milestone(); flash = 0.8; }

    if (player.buffer > 0) player.buffer -= dt;
    if (player.buffer > 0 && player.onGround) {
      player.vy = JUMP_V; player.onGround = false; player.buffer = 0; sfx.jump();
    }
    if (!player.onGround) {
      if (!held && player.vy < CUT_V) player.vy = CUT_V;
      player.vy += GRAV * dt;
      player.y += player.vy * dt;
      if (player.y >= GY - 26) { player.y = GY - 26; player.vy = 0; player.onGround = true; }
    }
    player.animT += dt * speed / 160;

    obsDist -= dx;
    if (obsDist <= 0) {
      const o = L.pick(score); o.x = W + 10; o.y = GY - o.h; obstacles.push(o);
      obsDist = (speed * (0.85 + Math.random() * 0.85) + 70) * cfg.gap;
    }
    acornDist -= dx;
    if (acornDist <= 0) {
      const clear = obstacles.every(o => Math.abs(o.x - (W + 10)) > 60);
      if (clear) { acorns.push({ x: W + 10, y: GY - 34 - Math.floor(Math.random() * 30) * 2, got: false }); acornDist = 220 + Math.random() * 380; }
      else acornDist = 30;
    }

    const box = { x: player.x + 14, y: player.y + 4, w: 16, h: 20 };
    for (const o of obstacles) {
      o.x -= dx;
      if (hit(box, { x: o.x + 2, y: o.y + 2, w: o.w - 4, h: o.h - 2 })) { gameOver(); return; }
    }
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    for (const a of acorns) {
      a.x -= dx;
      if (!a.got && hit(box, { x: a.x, y: a.y, w: 12, h: 12 })) {
        a.got = true; acornsGot++; score += 25; sfx.acorn();
        floats.push({ x: a.x, y: a.y, life: 0.8 });
      }
    }
    acorns = acorns.filter(a => !a.got && a.x > -14);
    for (const f of floats) { f.y -= 24 * dt; f.life -= dt; }
    floats = floats.filter(f => f.life > 0);
  }

  // ---------- drawing ----------
  function text(str, x, y, size, col, align = "left", shadow = "#2a0f22") {
    ctx.font = size + 'px "Press Start 2P", monospace';
    ctx.textAlign = align; ctx.textBaseline = "top";
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, x + Math.max(1, size / 8), y + Math.max(1, size / 8)); }
    ctx.fillStyle = col; ctx.fillText(str, x, y);
  }
  function layer(img, s) {
    const w = img.width, o = Math.floor(((s % w) + w) % w);
    ctx.drawImage(img, -o, 0); ctx.drawImage(img, w - o, 0);
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 6), Math.round((Math.random() - 0.5) * 4));

    const BAND = 16, sky = L.sky;
    sky.forEach((c, i) => R(ctx, -4, i * BAND - 4, W + 8, BAND + 4, c));
    R(ctx, -4, sky.length * BAND, W + 8, H, sky[sky.length - 1]);
    L.sun(sky);
    layer(L.far, scrollFar);
    layer(L.mid, scrollMid);
    const gx = Math.floor(scrollGround % 64);
    for (let x = -gx; x < W; x += 64) ctx.drawImage(L.ground, x, GY);

    for (const o of obstacles) drawObstacle(o);
    for (const a of acorns) {
      const by = Math.round(Math.sin(t * 5 + a.x * 0.05) * 2);
      ctx.drawImage(acornSpr, 0, 0, 6, 6, Math.round(a.x), a.y + by, 12, 12);
    }

    let spr;
    if (state === "over" || !player.onGround) spr = sqJump;
    else spr = Math.floor(player.animT / 0.1) % 2 ? sqRunB : sqRunA;
    const blink = state === "over" && Math.floor(overT * 8) % 2 === 0 && overT < 0.6;
    if (!blink) ctx.drawImage(spr, 0, 0, 16, 13, player.x, Math.round(player.y), 32, 26);

    for (const l of leaves) {
      const c = L.leaves[l.i % L.leaves.length];
      R(ctx, Math.round(l.x), Math.round(l.y), 3, 2, c); R(ctx, Math.round(l.x) + 1, Math.round(l.y) + 2, 1, 1, c);
    }
    for (const f of floats) text("+25", Math.round(f.x), Math.round(f.y), 8, "#ffd23f");
    ctx.restore();

    if (state !== "title") {
      const sc = String(Math.floor(score)).padStart(5, "0");
      const showScore = flash <= 0 || Math.floor(flash * 8) % 2 === 0;
      text("HI " + String(hi).padStart(5, "0"), W - 98, 8, 8, "#e9dcff");
      if (showScore) text(sc, W - 10, 8, 8, "#f6e7c8", "right");
      ctx.drawImage(acornSpr, 0, 0, 6, 6, 8, 6, 12, 12);
      text("x" + acornsGot, 24, 8, 8, "#f6e7c8");
    }
    if (state === "play" && bannerT > 0 && Math.floor(bannerT * 6) % 2 === 0) {
      text(L.name, W / 2, 40, 12, "#ffd23f", "center", "#5a1a10");
    }

    if (state === "title") {
      R(ctx, 0, 0, W, H, "rgba(18,9,31,0.45)");
      text("SQUIRREL", W / 2, 34, 24, "#ffd23f", "center", "#b3401a");
      text("DASH", W / 2, 62, 24, "#ff8a2a", "center", "#5a1a10");
      text("<  " + L.name + "  >", W / 2, 100, 8, "#f6e7c8", "center");
      if (Math.floor(t * 2) % 2 === 0) text("PRESS SPACE OR TAP", W / 2, 122, 8, "#ffd23f", "center");
      text("HI " + String(hi).padStart(5, "0"), W / 2, 140, 8, "#e9dcff", "center");
    }
    if (state === "over") {
      R(ctx, 0, 0, W, H, "rgba(18,9,31,0.55)");
      text("GAME OVER", W / 2, 50, 16, "#ff8a2a", "center", "#5a1a10");
      text("SCORE " + Math.floor(score), W / 2, 82, 8, "#f6e7c8", "center");
      text("ACORNS " + acornsGot, W / 2, 96, 8, "#e0a945", "center");
      if (newHi) text("NEW HIGH SCORE!", W / 2, 114, 8, Math.floor(t * 6) % 2 ? "#ffd23f" : "#ff8a2a", "center");
      if (overT > 0.6 && Math.floor(t * 2) % 2 === 0) text("TAP TO RUN AGAIN", W / 2, 140, 8, "#f6e7c8", "center");
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- input ----------
  const JUMP_KEYS = ["Space", "ArrowUp", "KeyW", "Enter"];
  window.addEventListener("keydown", e => {
    if (JUMP_KEYS.includes(e.code)) {
      if (e.target.tagName === "BUTTON" && e.code !== "ArrowUp") return;
      e.preventDefault();
      if (!e.repeat) press();
    } else if ((e.code === "ArrowLeft" || e.code === "ArrowRight") && state !== "play") {
      e.preventDefault(); cycleLevel(e.code === "ArrowLeft" ? -1 : 1);
    } else if (e.code === "KeyM") toggleSound();
  });
  window.addEventListener("keyup", e => { if (JUMP_KEYS.includes(e.code)) release(); });
  cvs.addEventListener("pointerdown", e => { e.preventDefault(); press(); });
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  cvs.addEventListener("contextmenu", e => e.preventDefault());

  // ---------- buttons ----------
  const speedVal = document.getElementById("speedVal"), soundVal = document.getElementById("soundVal"), levelVal = document.getElementById("levelVal");
  function paintButtons() {
    speedVal.textContent = SPEEDS[mode].label;
    soundVal.textContent = muted ? "OFF" : "ON";
    levelVal.textContent = L.label;
  }
  document.getElementById("levelBtn").addEventListener("click", e => { cycleLevel(1); e.currentTarget.blur(); });
  document.getElementById("speedBtn").addEventListener("click", e => {
    mode = mode === "gentle" ? "zoomy" : "gentle"; store.set("sqd-mode", mode);
    if (state === "play") speed = Math.min(Math.max(speed, SPEEDS[mode].start), SPEEDS[mode].max);
    paintButtons(); e.currentTarget.blur();
  });
  function toggleSound() { muted = !muted; store.set("sqd-muted", muted ? "1" : "0"); paintButtons(); if (!muted) sfx.acorn(); }
  document.getElementById("soundBtn").addEventListener("click", e => { toggleSound(); e.currentTarget.blur(); });
  const fsBtn = document.getElementById("fsBtn");
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  fsBtn.addEventListener("click", e => {
    e.currentTarget.blur();
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.getElementById("cabinet").requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (err) {}
  });
  paintButtons();
})();
</script>
</body>
</html>
