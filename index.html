<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ru's Squirrel Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: arcade title screen. Big heading, then one chunky cartridge per game, side by side on wide screens and stacked on phones. */
:root {
  --bg: #12091f;
  --panel: #1f1233;
  --ink: #f6e7c8;
  --muted: #b9a3d6;
  --accent: #ff8a2a;
  --gold: #ffd23f;
  --leaf: #6ad14f;
  --edge: #3a2457;
  --font-display: "Press Start 2P", "Courier New", monospace;
  --font-body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 22px;
  line-height: 1.2;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
}
main { max-width: 900px; margin: 0 auto; display: grid; gap: 28px; }
header { display: grid; gap: 14px; justify-items: center; text-align: center; }
.player { font-family: var(--font-display); font-size: 10px; color: var(--muted); letter-spacing: .12em; }
h1 {
  font-family: var(--font-display); font-weight: 400; margin: 0;
  font-size: clamp(20px, 5vw, 40px); line-height: 1.4;
  color: var(--gold); text-shadow: 4px 4px 0 #b3401a; text-wrap: balance;
}
.blink { font-family: var(--font-display); font-size: 11px; color: var(--accent); letter-spacing: .1em; animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.game {
  display: grid; gap: 12px; padding: 14px 14px 18px;
  background: var(--panel); color: var(--ink); text-decoration: none;
  border: 4px solid var(--edge); box-shadow: 6px 6px 0 #0a0512;
  transition: transform .08s;
}
.game:hover, .game:focus-visible { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 #0a0512; border-color: var(--accent); outline: none; }
.game:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0a0512; }
.game canvas { width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; image-rendering: pixelated; border: 3px solid #0a0512; }
.game h2 { font-family: var(--font-display); font-weight: 400; font-size: 14px; margin: 0; line-height: 1.5; }
.dash h2 { color: var(--accent); }
.course h2 { color: var(--leaf); }
.game p { margin: 0; color: var(--muted); }
.play { font-family: var(--font-display); font-size: 11px; justify-self: start; padding: 10px 14px; color: #12091f; background: var(--gold); border: 3px solid #0a0512; }
.course .play { background: var(--leaf); }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } .game { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="player">PLAYER 1: RU</span>
    <h1>RU'S SQUIRREL ARCADE</h1>
    <span class="blink">PICK A GAME</span>
  </header>
  <div class="games">
    <a class="game dash" href="dash.html">
      <canvas id="p-dash" width="160" height="90" aria-hidden="true"></canvas>
      <h2>SQUIRREL DASH</h2>
      <p>Run through the woods, jump over stumps and hedgehogs, and grab the acorns.</p>
      <span class="play">PLAY &#9654;</span>
    </a>
    <a class="game course" href="course.html">
      <canvas id="p-course" width="160" height="90" aria-hidden="true"></canvas>
      <h2>SQUIRREL COURSE BUILDER</h2>
      <p>Build an obstacle course with ramps, trees, springs and fans, then watch the squirrel race to the walnut.</p>
      <span class="play">BUILD &#9654;</span>
    </a>
  </div>
</main>
<script>
(() => {
  const SQ = [
    ".oo...........","oddo.......o..","odoo......ooo.","odo......oooko","odo.....oooooo",
    ".odo...ooooo..","..odooooocco..","...ooooooccc..","...oooooocc...","....oo..oo....","....d....d...."];
  const SQP = { o: "#d9772b", d: "#8b4513", c: "#f7dfb4", k: "#1a1a1a" };
  const NUT = ["...dd...","..bbbb..",".bwbbbb.","bwbbdbbb","bbbdbbbb","bbdbbbdb",".bbbbbb.","..bbbb.."];
  const NP = { b: "#c58a4a", w: "#ecc58c", d: "#7a4e24" };
  function spr(g, rows, pal, x, y, s) {
    rows.forEach((row, r) => [...row].forEach((ch, c) => {
      if (ch === ".") return; g.fillStyle = pal[ch]; g.fillRect(x + c * s, y + r * s, s, s);
    }));
  }
  function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }

  // Squirrel Dash: autumn wood at dusk
  const d = document.getElementById("p-dash").getContext("2d");
  R(d, 0, 0, 160, 90, "#3b1f4f"); R(d, 0, 30, 160, 30, "#6b2f4f"); R(d, 0, 50, 160, 20, "#b8513a");
  [[10, 18], [46, 24], [120, 14], [140, 22]].forEach(([x, h]) => { R(d, x, 70 - h - 14, 6, h + 14, "#2a1630"); R(d, x - 8, 70 - h - 22, 22, 14, "#4a2338"); });
  R(d, 0, 70, 160, 20, "#5a3a1e"); R(d, 0, 70, 160, 3, "#c4692a");
  R(d, 96, 62, 12, 8, "#7b4f2a"); R(d, 96, 62, 12, 2, "#e2b574");
  spr(d, NUT, NP, 126, 44, 1);
  spr(d, SQ, SQP, 50, 44, 2);

  // Course Builder: blue sky, ramp, spring, walnut on a branch
  const c = document.getElementById("p-course").getContext("2d");
  R(c, 0, 0, 160, 90, "#7ec8f0"); R(c, 0, 50, 160, 40, "#b4e0f6");
  R(c, 20, 12, 24, 5, "#fff"); R(c, 24, 9, 16, 3, "#fff"); R(c, 104, 18, 20, 4, "#fff");
  R(c, 0, 76, 160, 14, "#8a5a32"); R(c, 0, 76, 160, 4, "#5cc24a");
  for (let i = 0; i < 10; i++) R(c, 40 + i * 2, 76 - (i + 1) * 2, 2, (i + 1) * 2, i % 3 ? "#b07a3c" : "#f0bb6e");
  R(c, 66, 72, 14, 4, "#4b5563"); R(c, 68, 66, 10, 2, "#ef4444"); R(c, 70, 69, 8, 2, "#ef4444"); R(c, 64, 63, 18, 3, "#e5e7eb");
  R(c, 104, 40, 42, 5, "#5e3a1c"); R(c, 104, 40, 42, 2, "#b0743f"); R(c, 140, 45, 4, 3, "#4fb03e");
  spr(c, NUT, NP, 128, 30, 1);
  spr(c, SQ, SQP, 6, 54, 2);
})();
</script>
</body>
</html>
