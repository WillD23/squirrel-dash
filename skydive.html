<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squirrel Skydive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: an arcade cabinet. One portrait pixel screen, centred, with a chunky control deck underneath. */
:root{
  --bg:#16122a;
  --panel:#241d40;
  --edge:#3d3268;
  --ink:#f6efe0;
  --dim:#9d93c4;
  --acorn:#e8913f;
  --gold:#ffd23a;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--pixel);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.cab{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:relative;border:4px solid var(--edge);box-shadow:0 0 0 4px var(--panel),0 10px 0 4px #0b0918;background:#000;line-height:0;max-width:100%}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;max-width:100%}
.deck{display:flex;gap:8px;max-width:100%}
.deck button{flex:1 1 0;min-width:0;height:56px;font-family:var(--pixel);font-size:16px;color:var(--ink);background:var(--panel);border:3px solid var(--edge);border-bottom-width:7px;border-radius:6px;cursor:pointer;touch-action:none;padding:0}
.deck button small{display:block;font-size:7px;color:var(--dim);margin-top:5px;letter-spacing:.06em}
.deck button.on,.deck button:active{background:var(--edge);border-bottom-width:3px;transform:translateY(4px)}
.deck button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.deck .snd{flex:0 0 44px;font-size:12px}
.back{font-size:10px;color:var(--acorn);text-decoration:none;letter-spacing:.06em}
.back:hover,.back:focus-visible{color:var(--gold);text-decoration:underline}
.jump{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--pixel);font-size:16px;color:#3b1f0e;background:var(--gold);border:4px solid #3b1f0e;border-bottom-width:8px;border-radius:6px;padding:12px 22px;cursor:pointer;line-height:1;white-space:nowrap;box-shadow:0 0 0 3px #fff3b0}
.jump:active{border-bottom-width:4px;transform:translate(-50%,4px)}
.jump:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hint{font-size:8px;color:var(--dim);letter-spacing:.08em;text-align:center;line-height:1.6}
@media (hover:none){.hint{display:none}}
</style>

</head>
<body>
<div class="cab" id="cab">
  <a class="back" id="back" href="./">&#9664; ALL GAMES</a>
  <div class="screen"><canvas id="game" width="192" height="320" aria-label="Squirrel Skydive game screen"></canvas><button class="jump" id="jump" type="button">JUMP!</button></div>
  <div class="deck" id="deck">
    <button id="b-left" data-k="left" aria-label="Move left">&#9664;</button>
    <button id="b-glide" data-k="glide" aria-label="Glide slower">&#9650;<small>GLIDE</small></button>
    <button id="b-dive" data-k="dive" aria-label="Dive faster">&#9660;<small>DIVE</small></button>
    <button id="b-right" data-k="right" aria-label="Move right">&#9654;</button>
    <button id="b-snd" class="snd" aria-label="Toggle sound">&#9834;</button>
  </div>
  <div class="hint" id="hint">&#8592; &#8594; MOVE &nbsp; &#8593; GLIDE &nbsp; &#8595; DIVE &nbsp; P PAUSE</div>
</div>

<script>
(() => {
const W = 192, H = 320, PY = 96, START_ALT = 2500, MPP = 0.5;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- pixel helpers ---------- */
const PAL = {d:'#3b1f0e',o:'#c8641e',l:'#e8913f',c:'#f6ddb0',k:'#111',g:'#2b2b38',b:'#8fdcff',p:'#ef7a98',
  n:'#1d1a28',y:'#f2b632',w:'#fff',m:'#6e4219',a:'#c98a3a',h:'#f3c77a',r:'#e8344e'};
function makeSprite(rows, pal){
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.' && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}
function pcirc(g, cx, cy, r, col){
  g.fillStyle = col;
  for (let dy = -r; dy <= r; dy++){ const hw = Math.floor(Math.sqrt(r*r - dy*dy) + 0.3); g.fillRect(cx - hw, cy + dy, hw*2 + 1, 1); }
}
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- sprites ---------- */
const sqRows = [
  '....dddd',
  '...dllllddd',
  '..d' + 'l'.repeat(8) + 'd',
  '..d' + 'lllooolll' + 'd',
  '...d' + 'llooool' + 'd',
  '....d' + 'loool' + 'd',
  '.....d' + 'loo' + 'd',
  '...dod.dd.dod',
  '...d' + 'o'.repeat(8) + 'd',
  '...d' + 'gbbggbbg' + 'd',
  '...d' + 'gbkggkbg' + 'd',
  '...d' + 'ooccccoo' + 'd',
  '....d' + 'ccppcc' + 'd',
  'd' + 'ooo' + 'd' + 'cccccc' + 'd' + 'ooo' + 'd',
  'dd..d' + 'cccccc' + 'd..dd',
  '....d' + 'cccccc' + 'd',
  '....d' + 'ooccoo' + 'd',
  '...dood..dood',
  '..dood....dood',
  '..dd......dd'
];
const SQ = [makeSprite(sqRows, PAL), makeSprite(sqRows.map((r, i) => i < 7 ? '.' + r : r), PAL)];
const BIRD = [
  makeSprite(['n.........n','nn.......nn','.nnn.n.nnn.','...nnnnwyy.','....nnnn...'], PAL),
  makeSprite(['...........','...nnnnwyy.','.nnnnnnnn..','nn.......nn','n.........n'], PAL)
];
const acornRows = ['...m...','.mmmmm.','mmmmmmm','.aahaa.','.ahaaa.','.aaaaa.','..aaa..','...a...'];
const ACORN = makeSprite(acornRows, PAL);
const GOLD = makeSprite(acornRows, {m:'#b07a00',a:'#ffd23a',h:'#fff6b0'});
const heartRows = ['.hh.hh.','hhhhhhh','hhhhhhh','.hhhhh.','..hhh..','...h...'];
const HEART = makeSprite(heartRows, {h:'#e8344e'});
const HEART0 = makeSprite(heartRows, {h:'#4a4360'});

function makeCloud(w, h, dark){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const base = dark ? '#5b5675' : '#ffffff', shade = dark ? '#3a3652' : '#cfe3f7';
  const n = 3 + Math.floor(w / 14), blobs = [];
  for (let i = 0; i < n; i++){
    const r = Math.floor(h * 0.26 + Math.random() * h * 0.18);
    const cx = Math.floor(r + (w - 2*r) * (i / (n - 1)));
    const room = Math.max(0, h - 2*r - 3);
    const cy = Math.floor(h - r - 3 - Math.random() * room * 0.7);
    blobs.push([cx, cy, r]);
  }
  blobs.forEach(([x, y, r]) => pcirc(g, x, y + 2, r, shade));
  blobs.forEach(([x, y, r]) => pcirc(g, x, y, r, base));
  if (dark){ g.fillStyle = '#77729a'; blobs.forEach(([x, y, r]) => g.fillRect(x - 2, y - r + 1, 3, 1)); }
  return c;
}
const CLOUDS = [makeCloud(40, 16), makeCloud(56, 20), makeCloud(30, 13), makeCloud(70, 22)];
const STORMS = [makeCloud(44, 22, true), makeCloud(52, 24, true)];

function makeBalloon(a, b){
  const c = document.createElement('canvas'); c.width = 23; c.height = 36;
  const g = c.getContext('2d'), cx = 11;
  for (let y = 0; y <= 24; y++){
    let hw;
    if (y <= 12){ const t = (12 - y) / 12.6; hw = Math.round(11 * Math.sqrt(Math.max(0, 1 - t*t))); }
    else hw = Math.round(11 - (y - 12) * 0.6);
    for (let x = -hw; x <= hw; x++){
      let col = Math.floor((x + 11) / 4.6) % 2 ? b : a;
      if (Math.abs(x) === hw || y === 0) col = '#2a2240';
      g.fillStyle = col; g.fillRect(cx + x, y, 1, 1);
    }
  }
  g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(cx - 7, 5, 1, 4); g.fillRect(cx - 6, 4, 1, 2);
  g.fillStyle = '#3b2a1a'; g.fillRect(cx - 3, 25, 1, 5); g.fillRect(cx + 3, 25, 1, 5);
  g.fillStyle = '#8a5a2b'; g.fillRect(cx - 4, 30, 9, 6);
  g.fillStyle = '#5e3b1a'; g.fillRect(cx - 4, 30, 9, 1); g.fillRect(cx - 4, 35, 9, 1);
  return c;
}
const BALLOONS = [['#e8344e','#ffd23a'],['#3aa6e8','#ffffff'],['#7d4ce0','#5fd38a'],['#ff8a3a','#fff3c4']].map(s => makeBalloon(...s));

function makeKite(a, b){
  const c = document.createElement('canvas'); c.width = 13; c.height = 14;
  const g = c.getContext('2d'), cx = 6;
  for (let y = 0; y < 14; y++){
    const hw = y <= 5 ? y : Math.round((13 - y) * 0.7);
    for (let x = -hw; x <= hw; x++){ g.fillStyle = ((x < 0) !== (y < 6)) ? a : b; g.fillRect(cx + x, y, 1, 1); }
  }
  g.fillStyle = '#3b2a1a'; g.fillRect(cx, 0, 1, 14); g.fillRect(cx - 5, 5, 11, 1);
  return c;
}
const KITES = [makeKite('#e8344e','#ffd23a'), makeKite('#3aa6e8','#5fd38a'), makeKite('#7d4ce0','#ff8a3a')];

function spr(c, x, y, flip, alpha){
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  if (flip){ ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, -Math.floor(c.width/2), Math.round(y - c.height/2)); ctx.restore(); }
  else ctx.drawImage(c, Math.round(x - Math.floor(c.width/2)), Math.round(y - c.height/2));
  ctx.globalAlpha = 1;
}
function txt(s, x, y, size = 8, col = '#fff', align = 'left'){
  ctx.font = size + 'px "Press Start 2P", monospace'; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#1a1430'; ctx.fillText(s, x + 1, y + 1); if (size >= 16) ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function panel(x, y, w, h){
  ctx.fillStyle = 'rgba(22,18,42,.9)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ffd23a'; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x, y, 2, h); ctx.fillRect(x + w - 2, y, 2, h);
}

/* ---------- sound ---------- */
let ac = null, muted = false;
try { muted = localStorage.getItem('sqsd-mute') === '1'; } catch (e) {}
function ensureAudio(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f1, f2, dur, type = 'square', vol = 0.05, delay = 0){
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  acorn: () => tone(988, 1480, 0.09),
  gold: () => [660, 880, 1100, 1320].forEach((f, i) => tone(f, 0, 0.1, 'square', 0.05, i * 0.07)),
  hit: () => tone(220, 55, 0.3, 'sawtooth', 0.08),
  jump: () => tone(300, 760, 0.2, 'square', 0.05),
  perfect: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, 0.14, 'square', 0.05, i * 0.1)),
  land: () => [392, 523].forEach((f, i) => tone(f, 0, 0.14, 'square', 0.05, i * 0.1)),
  over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0, 0.2, 'triangle', 0.08, i * 0.16))
};
const sndBtn = document.getElementById('b-snd');
function paintSnd(){ sndBtn.innerHTML = muted ? '&#215;' : '&#9834;'; sndBtn.setAttribute('aria-pressed', String(!muted)); }
paintSnd();
sndBtn.addEventListener('click', () => { muted = !muted; try { localStorage.setItem('sqsd-mute', muted ? '1' : '0'); } catch (e) {} ensureAudio(); paintSnd(); });

/* ---------- state ---------- */
let best = 0;
try { best = +localStorage.getItem('squirrel-skydive-best') || 0; } catch (e) {}
let state = 'title', paused = false, t = 0, stateT = 0;
let level = 1, score = 0, acorns = 0, hearts = 3, alt = START_ALT, speed = 0;
let player = {x: W/2, y: PY, vx: 0, inv: 0, rot: 0, vy: 0};
let objs = [], decor = [], parts = [], streaks = [];
let obsGap = 0, acornGap = 0, cloudGap = 0, pileX = W/2, shake = 0, plane = null, landing = null;
const inp = {left: false, right: false, glide: false, dive: false};
let touchDir = 0;

function seedDecor(){
  decor = [];
  for (let i = 0; i < 6; i++) decor.push({x: rand(0, W), y: rand(0, H), c: pick(CLOUDS), par: rand(0.35, 0.7), front: false});
}
seedDecor();

function newGame(){
  level = 1; score = 0; acorns = 0; hearts = 3;
  startJump();
}
function startJump(){
  alt = START_ALT; objs = []; parts = []; obsGap = 140; acornGap = 60; landing = null;
  pileX = Math.round(rand(36, W - 36));
  player = {x: -100, y: 44, vx: 0, inv: 0, rot: 0, vy: 0};
  plane = {x: -40, y: 44};
  speed = 0; state = 'intro'; stateT = 0; seedDecor();
}
function action(){
  ensureAudio();
  if (state === 'title' || (state === 'over' && stateT > 1)) newGame();
  else if (state === 'landed' && stateT > 1.2){ level++; startJump(); }
}

/* ---------- spawning ---------- */
function spawnObstacle(p){
  const r = Math.random(); let tp;
  if (p < 0.33) tp = r < 0.5 ? 'bird' : r < 0.8 ? 'storm' : (level >= 2 ? 'drone' : 'bird');
  else if (p < 0.68) tp = r < 0.4 ? 'balloon' : r < 0.75 ? 'bird' : 'storm';
  else tp = r < 0.45 ? 'kite' : r < 0.8 ? 'bird' : 'balloon';
  const o = {t: tp, f: rand(0, 10)};
  if (tp === 'bird'){ o.x = rand(12, W - 12); o.y = H + 12; o.vx = (rand(18, 40) + level * 5) * (Math.random() < 0.5 ? -1 : 1); }
  if (tp === 'storm'){ o.c = pick(STORMS); o.x = rand(o.c.width/2, W - o.c.width/2); o.y = H + 16; o.zap = rand(0.5, 2.5); }
  if (tp === 'drone'){ o.x = rand(16, W - 16); o.y = H + 10; o.vx = (40 + level * 6) * (Math.random() < 0.5 ? -1 : 1); }
  if (tp === 'balloon'){ o.c = pick(BALLOONS); o.x = rand(16, W - 16); o.y = H + 20; o.bx = o.x; }
  if (tp === 'kite'){ o.c = pick(KITES); o.x = rand(14, W - 14); o.y = H + 10; o.bx = o.x; }
  objs.push(o);
}
function spawnAcorns(){
  const n = 3 + Math.floor(Math.random() * 3); let x = rand(14, W - 14); const dx = rand(-9, 9);
  const gold = hearts < 3 && Math.random() < 0.07;
  for (let i = 0; i < n; i++){
    x = Math.max(10, Math.min(W - 10, x + dx));
    objs.push({t: 'acorn', x, y: H + 10 + i * 14, gold: gold && i === n - 1, f: i});
  }
}
function boxes(o){
  switch (o.t){
    case 'bird': return [[o.x - 5, o.y - 2, 10, 5]];
    case 'storm': return [[o.x - o.c.width/2 + 4, o.y - o.c.height/2 + 4, o.c.width - 8, o.c.height - 8]];
    case 'drone': return [[o.x - 7, o.y - 3, 14, 6]];
    case 'balloon': return [[o.x - 9, o.y - 16, 18, 20], [o.x - 4, o.y + 12, 8, 6]];
    case 'kite': return [[o.x - 5, o.y - 6, 10, 11]];
    case 'acorn': return [[o.x - 5, o.y - 6, 10, 12]];
  }
  return [];
}
const hit = (a, b) => a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1];
function burst(x, y, n, cols, sp = 60, g = 0, life = 0.7){
  for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, s = rand(sp * 0.3, sp);
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - g * 0.4, g, life: rand(life * 0.6, life), max: life, col: pick(cols), sz: Math.random() < 0.3 ? 2 : 1}); }
}

/* ---------- update ---------- */
function update(dt){
  t += dt; stateT += dt;
  if (shake > 0) shake -= dt;
  const p = 1 - alt / START_ALT;

  // drifting clouds always move a little
  const scroll = (state === 'falling' ? speed : state === 'title' ? 20 : state === 'intro' ? 30 : 0);
  decor.forEach(d => { d.y -= scroll * d.par * dt; });
  decor = decor.filter(d => d.y > -40);
  cloudGap -= scroll * dt;
  if (cloudGap <= 0 && alt > 300){
    cloudGap = rand(40, 90);
    const front = state === 'falling' && Math.random() < 0.18;
    decor.push({x: rand(-10, W + 10), y: H + 20, c: pick(CLOUDS), par: front ? 1.3 : rand(0.35, 0.7), front});
  }

  parts.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.life -= dt; });
  parts = parts.filter(q => q.life > 0);

  if (state === 'intro'){
    const k = Math.min(1, stateT / 1.4);
    plane.x = -40 + (W * 0.5 + 40) * (1 - Math.pow(1 - k, 3));
    if (stateT >= 1.4){
      state = 'falling'; stateT = 0; sfx.jump();
      player.x = plane.x - 6; player.y = plane.y + 2; player.vy = -40;
    }
    return;
  }
  if (plane){ plane.x += 70 * dt; plane.y -= (state === 'falling' ? speed * 0.4 : 0) * dt; if (plane.x > W + 60 || plane.y < -30) plane = null; }

  if (state === 'falling'){
    const base = 100 + (level - 1) * 14;
    const target = base * (inp.dive ? 1.7 : inp.glide ? 0.55 : 1);
    speed += (target - speed) * Math.min(1, dt * 3);
    alt -= speed * dt * MPP;

    // player motion
    const dir = (inp.left ? -1 : 0) + (inp.right ? 1 : 0) || touchDir;
    player.vx += (dir * 85 - player.vx) * Math.min(1, dt * 8);
    player.x = Math.max(9, Math.min(W - 9, player.x + player.vx * dt));
    if (player.y < PY){ player.vy += 160 * dt; player.y = Math.min(PY, player.y + player.vy * dt); }
    if (player.inv > 0) player.inv -= dt;

    // spawn
    if (alt > 200){
      obsGap -= speed * dt; acornGap -= speed * dt;
      if (obsGap <= 0){ spawnObstacle(p); obsGap = Math.max(40, Math.min(120, 96 - level * 7 - p * 26)) + rand(0, 26); }
      if (acornGap <= 0){ spawnAcorns(); acornGap = rand(90, 150); }
    }
    // streaks
    if (Math.random() < (inp.dive ? 0.9 : 0.25)) streaks.push({x: rand(0, W), y: H + 4, len: rand(6, 16)});

    // move objects
    objs.forEach(o => {
      o.f += dt;
      o.y -= speed * dt;
      if (o.t === 'bird'){ o.x += o.vx * dt; }
      if (o.t === 'drone'){ o.x += o.vx * dt; if (o.x < 10 || o.x > W - 10) o.vx *= -1; }
      if (o.t === 'balloon'){ o.y -= 14 * dt; o.x = o.bx + Math.sin(o.f * 0.9) * 6; }
      if (o.t === 'kite'){ o.x = o.bx + Math.sin(o.f * 2) * 8; }
      if (o.t === 'storm'){ o.zap -= dt; if (o.zap < -0.35) o.zap = rand(1, 2.6); }
    });
    objs = objs.filter(o => o.y > -50 && o.x > -40 && o.x < W + 40);

    // collisions
    const pb = [player.x - 5, player.y - 3, 10, 12];
    for (const o of objs){
      if (o.dead) continue;
      if (!boxes(o).some(b => hit(pb, b))) continue;
      if (o.t === 'acorn'){
        o.dead = true;
        if (o.gold){ hearts = Math.min(3, hearts + 1); score += 50; sfx.gold(); burst(o.x, o.y, 14, ['#ffd23a', '#fff6b0', '#fff'], 50); }
        else { acorns++; score += 10; sfx.acorn(); burst(o.x, o.y, 6, ['#f3c77a', '#fff'], 35); }
      } else if (player.inv <= 0){
        hearts--; player.inv = 1.6; shake = 0.25; sfx.hit();
        burst(player.x, player.y, 10, ['#e8913f', '#f6ddb0', '#fff'], 50);
        if (o.t === 'bird'){ o.dead = true; burst(o.x, o.y, 8, ['#1d1a28', '#4a4360'], 40, 40); }
        if (hearts <= 0){ state = 'over'; stateT = 0; player.vy = -90; sfx.over(); saveBest(); }
      }
    }
    objs = objs.filter(o => !o.dead);

    if (alt <= 0 && state === 'falling'){
      alt = 0; state = 'landed'; stateT = 0; player.y = PY;
      const dx = Math.abs(player.x - pileX);
      if (dx <= 13){ landing = {txt: 'PERFECT LANDING!', bonus: 500, col: '#ffd23a'}; sfx.perfect(); burst(player.x, PY + 6, 34, ['#d9572b', '#e8892c', '#f0a03a', '#ffd23a'], 90, 160, 1.2); }
      else if (dx <= 28){ landing = {txt: 'NICE LANDING!', bonus: 250, col: '#8fe060'}; sfx.land(); burst(player.x, PY + 8, 18, ['#d9572b', '#f0a03a', '#5cb83c'], 70, 160, 1); }
      else { landing = {txt: 'BOING! MISSED', bonus: 50, col: '#8fdcff'}; sfx.land(); burst(player.x, PY + 9, 10, ['#5cb83c', '#8a5a2b'], 50, 160, 0.8); }
      score += landing.bonus + 200;
      saveBest();
    }
  }
  streaks.forEach(s => s.y -= (speed * 1.6 + 60) * dt);
  streaks = streaks.filter(s => s.y > -20 && state === 'falling');

  if (state === 'over'){
    player.vy += 260 * dt; player.y += player.vy * dt; player.rot += dt * 9;
  }
}
function saveBest(){ if (score > best){ best = score; try { localStorage.setItem('squirrel-skydive-best', String(best)); } catch (e) {} } }

/* ---------- draw ---------- */
function lerpC(a, b, k){
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
function drawSky(p){
  const top = lerpC('#23307e', '#5aa8f0', p), bot = lerpC('#4f7fd6', '#c3ecff', p);
  const bands = 10;
  for (let i = 0; i < bands; i++){ ctx.fillStyle = lerpC(top, bot, i / (bands - 1)); ctx.fillRect(0, Math.floor(i * H / bands), W, Math.ceil(H / bands)); }
  // sun
  const sy = 34 - p * 10;
  pcirc(ctx, 30, Math.round(sy), 11, '#fff3b0'); pcirc(ctx, 30, Math.round(sy), 8, '#ffe066');
}
function drawGround(gy){
  if (gy > H + 40) return;
  gy = Math.round(gy);
  // back hedges
  [8, 34, 62, 92, 124, 152, 182].forEach((x, i) => pcirc(ctx, x, gy - 2, 9 + (i % 3) * 2, i % 2 ? '#2f7d3a' : '#3a8f42'));
  // side trees
  [[12, 30], [W - 12, 26]].forEach(([x, h]) => {
    ctx.fillStyle = '#6b4220'; ctx.fillRect(x - 2, gy - h + 6, 5, h - 6);
    pcirc(ctx, x, gy - h, 12, '#2f7d3a'); pcirc(ctx, x - 3, gy - h - 3, 8, '#46a24c');
  });
  ctx.fillStyle = '#5cb83c'; ctx.fillRect(0, gy, W, 8);
  ctx.fillStyle = '#8fe060'; ctx.fillRect(0, gy, W, 2);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(0, gy + 8, W, Math.max(0, H - gy));
  ctx.fillStyle = '#734a22'; for (let x = 3; x < W; x += 13) ctx.fillRect(x, gy + 14 + (x % 3) * 5, 3, 2);
  // leaf pile
  pcirc(ctx, pileX - 9, gy, 7, '#c4461f'); pcirc(ctx, pileX + 9, gy, 7, '#d9702b');
  pcirc(ctx, pileX, gy - 3, 9, '#e8892c'); pcirc(ctx, pileX - 2, gy - 6, 5, '#f0a03a');
  ctx.fillStyle = '#ffd23a'; [[-5, -8], [4, -5], [-9, -2], [8, -1], [0, -10], [-2, -1]].forEach(([dx, dy]) => ctx.fillRect(pileX + dx, gy + dy, 2, 1));
  ctx.fillStyle = '#9b2f17'; [[-11, 2], [6, 3], [2, -4]].forEach(([dx, dy]) => ctx.fillRect(pileX + dx, gy + dy, 2, 1));
  // bouncing arrow over the pile
  if (state === 'falling'){
    const ay = gy - 22 + Math.round(Math.sin(t * 6) * 2);
    ctx.fillStyle = '#ffd23a';
    for (let i = 0; i < 4; i++) ctx.fillRect(pileX - 3 + i, ay + i, 7 - i * 2, 1);
    ctx.fillRect(pileX - 1, ay - 5, 3, 5);
  }
}
function drawObj(o){
  switch (o.t){
    case 'bird': spr(BIRD[Math.floor(o.f * 8) % 2], o.x, o.y, o.vx < 0); break;
    case 'storm': {
      if (o.zap < 0 && Math.floor(o.f * 20) % 2 === 0){
        ctx.fillStyle = '#ffe94a';
        let x = Math.round(o.x - 4), y = Math.round(o.y + o.c.height/2 - 2);
        for (let i = 0; i < 5; i++){ ctx.fillRect(x, y, 2, 4); x += i % 2 ? -3 : 3; y += 4; }
      }
      spr(o.c, o.x, o.y); break;
    }
    case 'drone': {
      const x = Math.round(o.x), y = Math.round(o.y), fr = Math.floor(o.f * 20) % 2;
      ctx.fillStyle = '#2b2b38'; ctx.fillRect(x - 7, y - 1, 15, 1); ctx.fillRect(x - 3, y - 2, 7, 4); ctx.fillRect(x - 6, y - 2, 1, 2); ctx.fillRect(x + 6, y - 2, 1, 2);
      ctx.fillStyle = '#a7a3bf'; if (fr){ ctx.fillRect(x - 9, y - 3, 6, 1); ctx.fillRect(x + 4, y - 3, 6, 1); } else { ctx.fillRect(x - 7, y - 3, 2, 1); ctx.fillRect(x + 6, y - 3, 2, 1); }
      ctx.fillStyle = Math.floor(o.f * 3) % 2 ? '#ff3b3b' : '#6b1a1a'; ctx.fillRect(x, y + 2, 1, 1);
      ctx.fillStyle = '#2b2b38'; ctx.fillRect(x - 3, y + 2, 1, 2); ctx.fillRect(x + 3, y + 2, 1, 2);
      break;
    }
    case 'balloon': spr(o.c, o.x, o.y); break;
    case 'kite': {
      ctx.fillStyle = 'rgba(40,30,60,.55)';
      for (let y = Math.round(o.y + 7); y < H; y += 2) ctx.fillRect(Math.round(o.x + (y - o.y) * 0.08), y, 1, 1);
      ctx.fillStyle = '#e8344e';
      for (let i = 1; i <= 3; i++){ const bx = Math.round(o.x + Math.sin(o.f * 6 + i) * 2), by = Math.round(o.y + 6 + i * 5); ctx.fillRect(bx - 2, by, 2, 2); ctx.fillRect(bx + 1, by, 2, 2); }
      spr(o.c, o.x, o.y); break;
    }
    case 'acorn': spr(o.gold ? GOLD : ACORN, o.x, o.y + Math.round(Math.sin(t * 5 + o.f) * 1.5)); break;
  }
}
function drawPlane(){
  if (!plane) return;
  const x = Math.round(plane.x), y = Math.round(plane.y);
  ctx.fillStyle = '#e8344e'; ctx.fillRect(x - 25, y - 11, 6, 8);
  ctx.fillStyle = '#c9c2ad'; ctx.fillRect(x - 27, y - 4, 5, 6);
  ctx.fillStyle = '#ece6d4'; ctx.fillRect(x - 22, y - 4, 40, 9);
  ctx.fillStyle = '#c9c2ad'; ctx.fillRect(x + 18, y - 3, 4, 7);
  ctx.fillStyle = '#e8344e'; ctx.fillRect(x - 22, y + 2, 40, 2);
  ctx.fillStyle = '#8fdcff'; ctx.fillRect(x + 11, y - 3, 5, 3); ctx.fillRect(x + 2, y - 2, 3, 2); ctx.fillRect(x - 3, y - 2, 3, 2);
  ctx.fillStyle = '#b3ab94'; ctx.fillRect(x - 6, y + 4, 16, 3);
  ctx.fillStyle = '#333'; if (Math.floor(t * 30) % 2) ctx.fillRect(x + 22, y - 6, 1, 13); else ctx.fillRect(x + 22, y - 1, 1, 3);
  ctx.fillStyle = '#2a2240'; ctx.fillRect(x - 12, y - 3, 6, 7);
  if (state === 'intro'){
    ctx.save(); ctx.beginPath(); ctx.rect(x - 12, y - 3, 6, 7); ctx.clip();
    ctx.drawImage(SQ[0], x - 17, y - 10); ctx.restore();
  }
}
function drawPlayer(){
  if (state === 'intro' || state === 'title') return;
  if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) return;
  const frame = SQ[Math.floor(t * (inp.dive ? 14 : 7)) % 2];
  if (state === 'over'){
    ctx.save(); ctx.translate(Math.round(player.x), Math.round(player.y)); ctx.rotate(player.rot);
    ctx.drawImage(frame, -8, -10); ctx.restore(); return;
  }
  let y = player.y;
  if (state === 'landed') y = PY + Math.min(4, Math.abs(Math.sin(stateT * 8)) * 6 * Math.max(0, 1 - stateT));
  if (inp.glide && state === 'falling'){
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(Math.round(player.x) - 11, Math.round(y) - 1, 3, 1); ctx.fillRect(Math.round(player.x) + 9, Math.round(y) - 1, 3, 1);
  }
  spr(frame, player.x, y);
}
function drawHUD(p){
  for (let i = 0; i < 3; i++) spr(i < hearts ? HEART : HEART0, 7 + i * 9, 8);
  txt(String(score).padStart(6, '0'), W / 2, 5, 8, '#fff', 'center');
  spr(ACORN, W - 34, 8); txt(String(acorns), W - 4, 5, 8, '#f3c77a', 'right');
  // altimeter
  const top = 24, bot = H - 26;
  ctx.fillStyle = 'rgba(20,16,40,.45)'; ctx.fillRect(W - 7, top, 3, bot - top);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; for (let i = 0; i <= 5; i++) ctx.fillRect(W - 9, Math.round(top + (bot - top) * i / 5), 2, 1);
  ctx.fillStyle = '#5cb83c'; ctx.fillRect(W - 8, bot, 5, 2);
  const my = Math.round(top + (bot - top) * Math.min(1, p));
  ctx.fillStyle = '#3b1f0e'; ctx.fillRect(W - 10, my - 2, 7, 5); ctx.fillStyle = '#e8913f'; ctx.fillRect(W - 9, my - 1, 5, 3);
  txt(Math.max(0, Math.round(alt)).toLocaleString('en-GB') + 'M', 4, H - 13, 8, '#fff');
  // target marker when the ground is still below the screen
  if (state === 'falling' && alt < 1100 && PY + 10 + alt / MPP > H + 10 && Math.floor(t * 4) % 2){
    ctx.fillStyle = '#ffd23a';
    for (let i = 0; i < 4; i++) ctx.fillRect(pileX - 3 + i, H - 22 + i, 7 - i * 2, 1);
  }
}
function drawOverlay(){
  if (state === 'title'){
    txt('SQUIRREL', W / 2, 36, 16, '#ffd23a', 'center');
    txt('SKYDIVE', W / 2, 58, 16, '#fff', 'center');
    const by = 120 + Math.round(Math.sin(t * 3) * 4);
    ctx.drawImage(SQ[Math.floor(t * 6) % 2], W / 2 - 24, by - 30, 48, 60);
    panel(12, 168, W - 24, 70);
    txt('DODGE BIRDS,', W / 2, 178, 8, '#fff', 'center');
    txt('BALLOONS & STORMS', W / 2, 192, 8, '#fff', 'center');
    txt('GRAB ACORNS', W / 2, 206, 8, '#f3c77a', 'center');
    txt('LAND IN THE LEAVES!', W / 2, 220, 8, '#ff9a4a', 'center');
    if (best) txt('BEST ' + best, W / 2, 298, 8, '#cfe3f7', 'center');
  }
  if (state === 'intro') txt('JUMP ' + level, W / 2, 140, 16, '#fff', 'center');
  if (state === 'falling' && stateT < 1.2 && Math.floor(stateT * 6) % 2 === 0) txt('GERONIMO!', W / 2, 140, 8, '#ffd23a', 'center');
  if (state === 'landed' && stateT > 0.6 && landing){
    panel(10, 150, W - 20, 104);
    txt(landing.txt, W / 2, 162, 8, landing.col, 'center');
    txt('LANDING +' + landing.bonus, W / 2, 182, 8, '#fff', 'center');
    txt('JUMP BONUS +200', W / 2, 196, 8, '#fff', 'center');
    txt('SCORE ' + score, W / 2, 214, 8, '#ffd23a', 'center');
  }
  if (state === 'over' && stateT > 0.8){
    panel(10, 92, W - 20, 132);
    txt('OUCH!', W / 2, 104, 16, '#e8344e', 'center');
    txt('SQUIRREL NEEDS', W / 2, 132, 8, '#fff', 'center');
    txt('A LITTLE NAP', W / 2, 146, 8, '#fff', 'center');
    txt('SCORE ' + score, W / 2, 166, 8, '#ffd23a', 'center');
    txt('BEST ' + best, W / 2, 180, 8, '#cfe3f7', 'center');
  }
  if (paused){ panel(40, 140, W - 80, 36); txt('PAUSED', W / 2, 153, 8, '#fff', 'center'); }
}
function draw(){
  const p = state === 'title' ? 0 : 1 - alt / START_ALT;
  ctx.save();
  if (shake > 0) ctx.translate(Math.round(rand(-2, 2)), Math.round(rand(-2, 2)));
  drawSky(p);
  decor.filter(d => !d.front).forEach(d => spr(d.c, d.x, d.y, false, 0.95));
  if (state !== 'title') drawGround(PY + 10 + alt / MPP);
  drawPlane();
  objs.forEach(drawObj);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  streaks.forEach(s => ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, Math.round(s.len)));
  drawPlayer();
  parts.forEach(q => { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), q.sz, q.sz); });
  ctx.globalAlpha = 1;
  decor.filter(d => d.front).forEach(d => spr(d.c, d.x, d.y, false, 0.6));
  ctx.restore();
  if (state !== 'title') drawHUD(p);
  drawOverlay();
}

/* ---------- jump button ---------- */
const jumpBtn = document.getElementById('jump');
let jumpKey = '';
function syncJump(){
  let key = '', label = '', top = 0;
  if (state === 'title'){ key = 't'; label = 'JUMP!'; top = 246; }
  else if (state === 'landed' && stateT > 1.2){ key = 'l'; label = 'NEXT JUMP'; top = 262; }
  else if (state === 'over' && stateT > 1){ key = 'o'; label = 'JUMP AGAIN'; top = 236; }
  if (key === jumpKey) return;
  jumpKey = key; jumpBtn.hidden = !key;
  if (key){ jumpBtn.textContent = label; jumpBtn.style.top = (top / H * 100) + '%'; }
}
jumpBtn.addEventListener('click', e => { e.preventDefault(); paused = false; action(); jumpBtn.blur(); syncJump(); });

/* ---------- loop ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  try {
    if (!paused) update(dt);
    draw();
  } catch (err) { console.error(err); }
  syncJump();
  requestAnimationFrame(loop);
}
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').catch(() => {});
requestAnimationFrame(loop);

/* ---------- input ---------- */
const KEYMAP = {ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
  ArrowUp: 'glide', w: 'glide', W: 'glide', ' ': 'glide', ArrowDown: 'dive', s: 'dive', S: 'dive'};
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') action();
  if (e.key === 'p' || e.key === 'P'){ if (state === 'falling') paused = !paused; }
  if (KEYMAP[e.key]){ inp[KEYMAP[e.key]] = true; e.preventDefault(); }
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) inp[KEYMAP[e.key]] = false; });
addEventListener('blur', () => { Object.keys(inp).forEach(k => inp[k] = false); touchDir = 0; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'falling') paused = true; });

let canvasPointer = null;
function dirFromEvent(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) < r.width / 2 ? -1 : 1; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (paused){ paused = false; return; }
  action();
  if (state === 'falling'){ canvasPointer = e.pointerId; touchDir = dirFromEvent(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
cv.addEventListener('pointermove', e => { if (e.pointerId === canvasPointer) touchDir = dirFromEvent(e); });
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, e => { if (e.pointerId === canvasPointer){ canvasPointer = null; touchDir = 0; } }));

document.querySelectorAll('.deck button[data-k]').forEach(btn => {
  const k = btn.dataset.k;
  const down = e => { e.preventDefault(); if (paused) paused = false; action(); inp[k] = true; btn.classList.add('on'); try { btn.setPointerCapture(e.pointerId); } catch (_) {} };
  const up = () => { inp[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, up));
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- sizing ---------- */
const back = document.getElementById('back'), deck = document.getElementById('deck'), hint = document.getElementById('hint'), cab = document.getElementById('cab');
function resize(){
  const cs = getComputedStyle(cab);
  const availW = cab.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 16;
  const hintH = hint.offsetParent ? hint.offsetHeight + 14 : 0;
  const availH = cab.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - deck.offsetHeight - 14 - hintH - 26 - back.offsetHeight - 14;
  let s = Math.min(availW / W, availH / H);
  if (s >= 2) s = Math.floor(s * 2) / 2;
  s = Math.max(1, s);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  deck.style.width = Math.max(260, Math.floor(W * s) + 16) + 'px';
}
addEventListener('resize', resize); resize();
})();
</script>
</body>
